# Broker MQTT para las líneas (ESP32). Pensado para LAN del local:
# sin auth (igual que el Socket.IO actual); si algún día se expone
# fuera de la LAN, agregar password_file y TLS.
listener 1883
allow_anonymous true

# Persistencia: conserva mensajes retained (device info, emergencyCard)
# y colas QoS>0 entre reinicios del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Una línea solo publica ventas y lecturas de tarjeta: colas cortas bastan
# y evitan que un cliente roto llene el disco de la Pi.
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
