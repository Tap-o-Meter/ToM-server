# ToM Server — orquestacion app + MongoDB
#
# Uso:
#   cp .env.example .env   # y completar valores
#   docker compose up -d --build
#
# Notas:
# - mongo esta PINEADO a 4.4 a proposito: mongoose 4.2.8 no se conecta a Mongo
#   5+, y ademas Mongo 5+ no corre en Raspberry Pi 4 (requiere ARMv8.2-A).
# - Socket.IO queda en 2.3.0 (compatibilidad con dispositivos legacy). La imagen
#   solo lo empaqueta, no lo cambia.
# - mosquitto es el canal nuevo de las lineas (firmware MQTT). Las lineas con
#   firmware viejo siguen entrando por Socket.IO: ambos canales conviven.
# - rewards (plugin de beneficios VIP) es OPCIONAL: se levanta con
#     docker compose --profile rewards up -d --build
#   Sin el profile, el sistema opera sin rewards (el manager oculta esas
#   secciones via /capabilities).

services:
  app:
    build: .
    image: tom-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # En Docker la DB es el servicio 'mongo' (no localhost)
      MONGODB_URI: mongodb://mongo:27017/beer_control
      # Path de datos dentro del contenedor (coincide con el volumen de abajo)
      DATA_FOLDER: /home/tom/Documents/Beer_control/data
      # En Docker el broker es el servicio 'mosquitto' (no localhost)
      MQTT_URL: mqtt://mosquitto:1883
      # Plugin de rewards (si el profile esta activo; si no, /capabilities
      # reporta rewards:false y todo lo demas sigue igual)
      REWARDS_URL: http://rewards:3001
    ports:
      - "3000:3000"
      - "3443:3443"
    volumes:
      # Datos de la instalacion (local.json, .emergencyCard.json)
      - ./data:/home/tom/Documents/Beer_control/data
      # Logo / dist
      - ./dist:/home/tom/Documents/dist
      # Imagenes subidas (fotos de personal/cervezas) — persistencia
      - ./images:/usr/src/app/images
      - ./uploads:/usr/src/app/uploads
      # Certificados SSL (opcional; si no existen, arranca solo HTTP)
      - ./cert:/usr/src/app/cert:ro
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started

  rewards:
    profiles: ["rewards"]
    build: ../ToM Rewards
    image: tom-rewards:latest
    restart: unless-stopped
    environment:
      # Misma instancia de Mongo, base de datos propia del plugin
      MONGODB_URI: mongodb://mongo:27017/rewards
      MQTT_URL: mqtt://mosquitto:1883
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Las lineas (ESP32) en la LAN se conectan directo al broker
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Descomenta solo si necesitas acceder a Mongo desde fuera del host:
    # ports:
    #   - "127.0.0.1:27017:27017"

volumes:
  mongo-data:
  mosquitto-data:
